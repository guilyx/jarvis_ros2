name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Core stays ROS-free (ADR-0001)
        run: scripts/check_core_ros_free.sh
      - name: One version for every package (RELEASING.md)
        run: python3 scripts/version.py --check
      - name: shellcheck
        run: shellcheck demo docker/demo/bin/* docker/demo/smoke_test.sh scripts/soak.sh
      - name: clang-format
        run: |
          find core ros \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 --no-run-if-empty clang-format-18 --dry-run --Werror
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff
        run: |
          pip install ruff==0.17.0
          ruff check .
          ruff format --check .

  core:
    name: Core (ROS-free, ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libyaml-cpp-dev nlohmann-json3-dev libgtest-dev libgmock-dev
      - name: Build
        run: |
          cmake -S core/jarvis_core -B build/core -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DJARVIS_SANITIZE=ON -DJARVIS_WERROR=ON -DJARVIS_COVERAGE=ON
          cmake --build build/core
      - name: Test
        run: ctest --test-dir build/core --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coverage (in the job summary; fails under 90 % of lines)
        run: |
          pip install gcovr==8.3
          gcovr -r core/jarvis_core --filter core/jarvis_core/src/ --filter core/jarvis_core/include/ \
            --exclude-unreachable-branches --txt build/core/coverage.txt --print-summary \
            --fail-under-line 90 build/core || status=$?
          cat build/core/coverage.txt
          { echo "### Core coverage"; echo '```'; cat build/core/coverage.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"
      - name: Bench against the NFR targets (Release)
        run: |
          cmake -S core/jarvis_core -B build/bench -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DJARVIS_WERROR=ON
          cmake --build build/bench --target jarvis-bench
          build/bench/jarvis-bench --check

  schemas:
    name: Schemas
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema pyyaml pytest
      - run: pytest -q schemas/tests

  lake:
    name: Lake (ROS-free)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # NumPy as ROS Jazzy has it (Ubuntu 24.04): the libraries must work with it.
      - run: |
          pip install numpy==1.26.4 -r lake/jarvis_lake/requirements.txt \
            pytest pytest-cov==6.0.0 coverage==7.6.4
      - run: PYTHONPATH=lake/jarvis_lake pytest -q --cov=jarvis_lake --cov-fail-under=78 lake/jarvis_lake/test
      - name: Coverage (in the job summary)
        if: ${{ !cancelled() }} # also when the tests fail the coverage floor
        run: '{ echo "### Lake coverage"; coverage report --format=markdown; } >>"$GITHUB_STEP_SUMMARY"'

  gateway:
    name: Gateway (ROS-free, fake Jarvis)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install numpy==1.26.4 pyyaml pytest pytest-cov==6.0.0 coverage==7.6.4 \
            -r lake/jarvis_lake/requirements.txt -r gateway/jarvis_gateway/requirements.txt
      - run: |
          PYTHONPATH=lake/jarvis_lake:gateway/jarvis_gateway \
            pytest -q --cov=jarvis_gateway --cov-fail-under=79 gateway/jarvis_gateway/test
      - name: Coverage (in the job summary)
        if: ${{ !cancelled() }} # also when the tests fail the coverage floor
        run: '{ echo "### Gateway coverage"; coverage report --format=markdown; } >>"$GITHUB_STEP_SUMMARY"'
      - name: MCP server (jarvis_mcp, against this gateway; the official MCP client for interop)
        run: |
          pip install mcp==2.3.0
          pytest -q agent/jarvis_mcp/test

  agent:
    name: Agent (ROS-free)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install numpy==1.26.4 pyyaml pytest jsonschema pytest-cov==6.0.0 coverage==7.6.4 \
            -r agent/jarvis_agent/requirements.txt \
            -r lake/jarvis_lake/requirements.txt -r gateway/jarvis_gateway/requirements.txt
          pip install --require-hashes -r agent/jarvis_agent/requirements-llm.txt
      - run: PYTHONPATH=agent/jarvis_agent pytest -q --cov=jarvis_agent --cov-fail-under=87 agent/jarvis_agent/test
      - name: Coverage (in the job summary)
        if: ${{ !cancelled() }} # also when the tests fail the coverage floor
        run: '{ echo "### Agent coverage"; coverage report --format=markdown; } >>"$GITHUB_STEP_SUMMARY"'

  dashboard:
    name: Dashboard (lint, unit, e2e on the fake)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install numpy==1.26.4 pyyaml \
            -r ../lake/jarvis_lake/requirements.txt -r ../gateway/jarvis_gateway/requirements.txt
      - run: npm ci
      - run: npm run lint
      - name: The typed client matches the gateway's API
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dashboard-e2e-fake
          path: dashboard/playwright-report

  ros:
    # Jazzy (Ubuntu 24.04) and Lyrical Luth (Ubuntu 26.04), the two LTS releases; and Jazzy on ARM64,
    # what most robot computers are (Jetson, Raspberry Pi, RK3588), natively on an ARM runner.
    name: ROS 2 ${{ matrix.name }} (build + test)
    runs-on: ${{ matrix.runner || 'ubuntu-24.04' }}
    container: ros:${{ matrix.distro }}-ros-base
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: jazzy, name: Jazzy }
          - { distro: lyrical, name: Lyrical }
          - { distro: jazzy, name: Jazzy arm64, runner: ubuntu-24.04-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          rosdep update --rosdistro ${{ matrix.distro }}
          rosdep install --from-paths core ros lake gateway agent --ignore-src -y --rosdistro ${{ matrix.distro }}
          apt-get install -y --no-install-recommends python3-pip
          # --ignore-installed: next to Debian's copies (Ubuntu 26.04's pip can't upgrade them).
          pip3 install --break-system-packages --ignore-installed -r lake/jarvis_lake/requirements.txt \
            -r gateway/jarvis_gateway/requirements.txt -r agent/jarvis_agent/requirements.txt
      - name: Build
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build --event-handlers console_cohesion+ \
            --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Test
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          export ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST ROS_DOMAIN_ID=42
          colcon test --event-handlers console_cohesion+ --return-code-on-test-failure
      - name: Test results
        if: always()
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon test-result --verbose

  demo:
    # The image the release publishes, on both architectures (ARM64 natively); the dashboard's e2e
    # suite once, on amd64.
    name: Docker demo${{ matrix.arch == 'arm64' && ' arm64' || '' }} (build + smoke test)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the demo image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: demo
          tags: jarvis_ros2:demo
          load: true
          cache-from: type=gha,scope=demo-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=demo-${{ matrix.arch }}
      - name: Smoke test (the commands from the README)
        run: docker/demo/smoke_test.sh
      - name: The image is for this machine
        run: |
          arch="$(docker image inspect jarvis_ros2:demo --format '{{.Architecture}}')"
          [ "${arch}" = "${{ matrix.arch }}" ] || { echo "::error::built for ${arch}"; exit 1; }
      - uses: actions/setup-node@v4
        if: matrix.arch == 'amd64'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Dashboard e2e against a fresh demo (e-stop latched)
        if: matrix.arch == 'amd64'
        run: |
          docker compose down && sudo rm -rf demo-data
          docker compose up -d --no-build && ./demo wait
          ./demo inject estop
          cd dashboard && npm ci && npx playwright install --with-deps chromium
          E2E_BASE_URL=http://localhost:8080 E2E_VIDEO=1 npm run e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.arch == 'amd64'
        with:
          name: dashboard-e2e-demo
          path: |
            dashboard/playwright-report
            dashboard/test-results
      - name: Stop the demo
        if: always()
        run: docker compose down
