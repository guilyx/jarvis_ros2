# Python lint/format settings for the whole repo (agent, gateway, lake, tests, launch files).
line-length = 110
target-version = "py312"
extend-exclude = ["build", "install", "log"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[format]
quote-style = "double"

[lint.flake8-bugbear]
# FastAPI declares parameters with calls in defaults (Depends, Query, Header): that is the idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
