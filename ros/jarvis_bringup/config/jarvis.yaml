# Parameters of the Jarvis components. jarvis.launch.py sets robot_id, state_dir, catalog_path,
# use_sim_time and autostart on top of these.
/jarvis/event_hub:
  ros__parameters:
    rate_limit_per_sec: 50.0      # per (node, code, component)
    rate_limit_burst: 100.0
    suppression_window_s: 10.0
    shed_after_s: 1.0             # behind by more than this, INFO/DEBUG logs are dropped (0: never)
    shed_below: WARN
    buffer_capacity_mb: 128       # recent-events ring buffer, must cover one recorder split
    max_causal_depth: 16
    batch_max_events: 500         # the stream goes out in batches (/jarvis/event_batches): this many
    batch_period_ms: 5            # at most, or this long after a batch's first event

/jarvis/fault_manager:
  ros__parameters:
    incident_min_severity: ERROR
    incident_merge_window_s: 120.0
    incident_auto_close_h: 24.0
    max_resolved_incidents: 500   # kept until they auto-close; the oldest close early
    export_diagnostics: true
    blackbox_service: /jarvis/blackbox/snapshot
    blackbox_wait_s: 2.0          # a capture waits this long for the recorder (e.g. at startup)
    blackbox_timeout_s: 10.0      # and this long for its answer once asked

/jarvis/rule_engine:
  ros__parameters:
    recovery_action: /jarvis/recovery/execute
    recovery_wait_s: 5.0          # a recover action waits this long for the orchestrator (startup)
    max_partitions: 1000          # per rule

/jarvis/recovery:
  ros__parameters:
    max_concurrent: 4             # top-level executions at once
    approval_ttl_s: 300.0         # PENDING_APPROVAL expires after
    agent_autonomy: supervised    # ceiling for the agent: never, advise, supervised, autonomous
    min_confidence: 0.8           # autonomous agent runs need this confidence
    separate_approver: true       # four-eyes: nobody approves a run they asked for
    max_depth: 3                  # nesting of `run` steps
    recent_executions: 20         # settled executions kept on /jarvis/executions
    actuators:                    # pluginlib, base class jarvis_ros::Actuator; add
      - jarvis_ros::LifecycleActuator   # jarvis_nav2::Nav2Actuator on a Nav2 robot
      - jarvis_ros::ServiceActuator
      - jarvis_ros::ParamActuator
      - jarvis_ros::BagActuator

/jarvis/bridges/diagnostics:
  ros__parameters:
    topic: /diagnostics
    code_prefix: diag
    ignore_hardware_ids: [jarvis]
    repeat_period_s: 0.0          # level changes only

/jarvis/bridges/rosout:
  ros__parameters:
    topic: /rosout
    min_level: WARN
    fault_level: ERROR
    ignore_loggers: ["jarvis.*"]
    fault_repeat_period_s: 1.0

/jarvis/bridges/action_status:
  ros__parameters:
    discovery_period_s: 2.0       # watches every action server; set `actions` to narrow it
    ignore_actions: ["/jarvis/*"] # a failed recovery is already a RECOVERY event

/jarvis/bridges/lifecycle:
  ros__parameters:
    discovery_period_s: 2.0       # watches every managed node; set `nodes` to narrow it

# What to watch is robot-specific: add it in your own params file, e.g.
#   /jarvis/bridges/topic_watchdog:
#     ros__parameters:
#       topics: [scan]
#       scan: { topic: /scan, component: lidar, stale_after_s: 1.0, min_rate_hz: 5.0 }
#   /jarvis/bridges/node_watchdog:
#     ros__parameters:
#       nodes: [/controller_server, /planner_server]
/jarvis/bridges/topic_watchdog:
  ros__parameters:
    tick_period_s: 0.1

/jarvis/bridges/node_watchdog:
  ros__parameters:
    grace_s: 5.0
    period_s: 1.0
