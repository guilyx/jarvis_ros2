name: Soak

# Jarvis under load for 15 minutes (scripts/soak.sh, docs/design/01-requirements.md §5): nightly
# and on demand, not on pull requests. The steady part (500 events/s) must lose nothing, keep p99
# under 100 ms and the RSS under its bound; a peak at 5000 events/s with a 20 000-event burst is
# reported. The reports are the run's artifact.

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Length of the steady part, in seconds"
        required: false
        default: "900"
      rate:
        description: "Events per second of the steady part"
        required: false
        default: "500"

permissions:
  contents: read

concurrency:
  group: soak
  cancel-in-progress: false

jobs:
  soak:
    name: Soak
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      SECONDS_STEADY: ${{ inputs.seconds || '900' }}
      RATE: ${{ inputs.rate || '500' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          rosdep update --rosdistro jazzy
          rosdep install --from-paths core ros lake gateway agent --ignore-src -y --rosdistro jazzy
          apt-get install -y --no-install-recommends python3-pip
          pip3 install --break-system-packages -r lake/jarvis_lake/requirements.txt \
            -r gateway/jarvis_gateway/requirements.txt -r agent/jarvis_agent/requirements.txt
      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_cohesion+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - name: Soak
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          export ROS_LOCALHOST_ONLY=1
          scripts/soak.sh out "$SECONDS_STEADY" "$RATE"
      - name: Summary
        if: always()
        run: |
          {
            echo "## Soak"
            for report in out/soak.txt out/peak.txt; do
              [ -s "$report" ] || continue
              echo '```'
              cat "$report"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak
          path: out/
          retention-days: 30
