schema: jarvis.faults/v1
defaults:
  severity: ERROR
  debounce: immediate
  heal: { on_clear: true }
faults:
  - code: demo.sensor.stale
    description: Demo sensor stopped publishing.
    debounce: { persist: 300ms }
  - code: safety.estop.engaged
    severity: CRITICAL
    latch: true
    incident: always
  - code: demo.capture.me
    description: Asks for a black-box snapshot.
    capture: { blackbox: true }
