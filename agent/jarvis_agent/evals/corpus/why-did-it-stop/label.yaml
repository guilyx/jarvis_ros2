schema: jarvis.eval/v1
description: >-
  An operator asks why the robot stopped, ten seconds after the tour's e-stop latched; the lidar,
  motor and log faults of the minutes before are over or unrelated.
events: ../../recordings/demo_tour.jsonl
plans: ../../recordings/demo_tour.plans.json
drop: ["demo.tour.*"]  # the tour narrates what happens: it would give the answers away
at: 2026-10-17T14:26:40.000Z
trigger: {type: ON_DEMAND, question: "Why did the robot stop?"}
root_cause:
