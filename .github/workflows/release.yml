name: Release

# Pushing a tag vX.Y.Z (RELEASING.md) publishes that version: the Docker images on GitHub's
# container registry, and a GitHub release with the notes from CHANGELOG.md. The tag must match
# the version of every package (scripts/version.py), and CHANGELOG.md must have its section.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: The tag is the packages' version
        run: |
          version="$(python3 scripts/version.py)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} but the packages are at ${version} (scripts/version.py ${GITHUB_REF_NAME#v})"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: CHANGELOG.md has its section
        run: |
          grep -q "^## ${{ steps.version.outputs.version }} (" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## ${{ steps.version.outputs.version }} (date)' section"; exit 1; }

  images:
    # Each image for each architecture, on a runner of that architecture (no emulation: ROS and the
    # whole workspace build natively), pushed by digest; `manifests` tags them as one image.
    name: Docker image ${{ matrix.image }} (${{ matrix.arch }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [runtime, demo]
        arch: [amd64, arm64]
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
          - { target: runtime, image: jarvis }
          - { target: demo, image: jarvis-demo }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.licenses=Apache-2.0
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}
      - name: Keep the digest for the manifest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifests:
    name: Docker image ${{ matrix.image }} (amd64 + arm64)
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [jarvis, jarvis-demo]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Tag both architectures as one image
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          set -- *
          [ "$#" = 2 ] || { echo "::error::expected 2 digests, got: $*"; exit 1; }
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
          sources=()
          for digest in "$@"; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - name: Both architectures are there
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${IMAGE}"
          platforms="$(docker buildx imagetools inspect "${IMAGE}" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | select(.os == "linux") | .architecture] | sort | join(",")')"
          [ "${platforms}" = "amd64,arm64" ] || { echo "::error::platforms: ${platforms}"; exit 1; }

  release:
    name: GitHub release
    needs: [verify, manifests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ needs.verify.outputs.version }}" '
            $0 ~ "^## " v " \\(" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            cat notes.md
            echo
            echo "### Docker images (amd64 and arm64)"
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${owner}/jarvis:${{ needs.verify.outputs.version }}        # Jarvis"
            echo "docker pull ghcr.io/${owner}/jarvis-demo:${{ needs.verify.outputs.version }}   # with the demo robot"
            echo '```'
          } > body.md
          gh release create "${GITHUB_REF_NAME}" --title "Jarvis ${GITHUB_REF_NAME}" --notes-file body.md --verify-tag
