name: Evals

# The agent on the labelled corpus (agent/jarvis_agent/evals, docs/design/06-agent.md §10): nightly
# and on demand, not on pull requests. The heuristic analyst always runs (free, deterministic). A
# model runs when one is set (the input, or the JARVIS_EVAL_MODEL repository variable) and its
# provider's key is a secret, under a cost cap; JARVIS_EVAL_JUDGE adds an LLM judge. The report,
# the rows for evals/results.tsv and the model's traces are the run's artifact.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "A LiteLLM model string (empty: the JARVIS_EVAL_MODEL variable, else heuristic only)"
        required: false
      judge:
        description: "A LiteLLM model that grades root causes in words (empty: JARVIS_EVAL_JUDGE)"
        required: false
      max_cost_usd:
        description: "Cost cap of the model run, in USD"
        required: false
        default: "2"

permissions:
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  evals:
    name: Evals
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODEL: ${{ inputs.model || vars.JARVIS_EVAL_MODEL }}
      JUDGE: ${{ inputs.judge || vars.JARVIS_EVAL_JUDGE }}
      MAX_COST_USD: ${{ inputs.max_cost_usd || vars.JARVIS_EVAL_MAX_COST_USD || '2' }}
      PYTHONPATH: agent/jarvis_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install pyyaml -r agent/jarvis_agent/requirements.txt
          pip install --require-hashes -r agent/jarvis_agent/requirements-llm.txt
          mkdir -p out
      - name: Heuristic analyst
        run: |
          python -m jarvis_agent.cli --heuristic eval --report out/heuristic.json \
            --results out/results.tsv --note "nightly" | tee out/heuristic.txt
      - name: Model analyst
        if: env.MODEL != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          judge=()
          if [ -n "$JUDGE" ]; then judge=(--judge "$JUDGE"); fi
          python -m jarvis_agent.cli --model "$MODEL" eval "${judge[@]}" --max-cost-usd "$MAX_COST_USD" \
            --traces out/traces --report out/model.json --results out/results.tsv --note "nightly" \
            | tee out/model.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "## Evals"
            for table in out/heuristic.txt out/model.txt; do
              [ -s "$table" ] || continue
              echo '```'
              cat "$table"
              echo '```'
            done
            echo "Rows for evals/results.tsv (commit them with a prompt or model change):"
            echo '```'
            cat out/results.tsv 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals
          path: out/
          retention-days: 30
